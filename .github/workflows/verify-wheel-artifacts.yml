name: Test wheel artifacts
on:
  push:
    branches:
      - codex/test-wheel-artifacts-41793895080
permissions:
  contents: read
  actions: read
jobs:
  test-wheel:
    name: Installed wheel on ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, macos-latest, windows-latest]
        python: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tests/
            /tools/validate-wheel-artifact.py
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}
          path: artifacts
          run-id: 41793895080
          github-token: ${{ github.token }}
      - name: Install and test existing wheel in a clean environment
        run: python tools/validate-wheel-artifact.py artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: consumer-tests-${{ matrix.os }}-py${{ matrix.python }}
          path: reports/wheel-tests.xml
