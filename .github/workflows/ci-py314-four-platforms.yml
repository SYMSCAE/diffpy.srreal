name: cibw wheels on four platforms

on:
  push:
    branches:
      - codex/ci-py314-four-platforms
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Same chain as the release workflow: versions come from the classifiers.
  get-python-version:
    uses: SYMSCAE/release-scripts/.github/workflows/_get-python-version-latest.yml@b2587d489d9a57082d752997ce20b51cc338eaa6
    with:
      python_version: 0

  wheel-extension:
    needs: [get-python-version]
    uses: SYMSCAE/release-scripts/.github/workflows/_build-wheel.yml@b2587d489d9a57082d752997ce20b51cc338eaa6
    with:
      project: diffpy.srreal
      c_extension: true
      build_c_ext_with_cibw: true
      submodules: recursive
      latest_python_version: ${{ fromJSON(needs.get-python-version.outputs.latest_python_version) }}
      python_versions_json: ${{ needs.get-python-version.outputs.python_versions_json }}
